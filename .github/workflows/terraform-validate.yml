name: Terraform Validate

on:
  pull_request:
    paths:
      - ".github/workflows/terraform-validate.yml"
      - "terraform/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/terraform-validate.yml"
      - "terraform/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Terraform format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

  validate:
    name: Validate ${{ matrix.directory }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        directory:
          - terraform/bootstrap/state
          - terraform/bootstrap/identity/federation
          - terraform/bootstrap/identity/development
          - terraform/modules/deployment-policy
          - terraform/modules/deployment-roles
          - terraform/modules/ec2-instance
          - terraform/modules/github-oidc-policy
          - terraform/modules/github-oidc-provider
          - terraform/modules/github-roles
          - terraform/modules/subnet-instance
          - terraform/modules/terraform-apply-policy
          - terraform/modules/vpc-instance

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2

      - name: Initialize without backend
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        working-directory: ${{ matrix.directory }}
        run: terraform validate -no-color
